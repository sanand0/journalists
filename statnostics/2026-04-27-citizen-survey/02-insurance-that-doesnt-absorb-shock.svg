<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
<defs>
<style>
.mast-bg  { fill: #ed1c24; }
.wm-wh    { font-family: PoynterAgateOne-BoldCondensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:19px; font-weight:bold; fill:#ffffff; }
.wm-dk    { font-family: PoynterAgateOne-BoldCondensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:19px; font-weight:bold; fill:#231f20; }
.tagline  { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:15px; fill:#ffffff; }
.border   { fill:none; stroke:#231f20; stroke-width:0.8; }
.sep      { stroke:#231f20; stroke-width:0.6; fill:none; }
.hl       { font-family: PoynterOSDisplay-Bold,'Poynter OS Display',Georgia,'Times New Roman',serif; font-size:24px; font-weight:bold; fill:#231f20; }
.deck     { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:13px; fill:#231f20; }
.note     { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:10.5px; fill:#6b7280; }
.source   { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:9.4px; fill:#9ca3af; }
.jar-lbl  { font-family: PoynterAgateOne-BoldCondensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:11px; font-weight:bold; text-anchor:middle; }
.jar-val  { font-family: GriffithGothic-Bold,'Griffith Gothic','Arial Narrow',Arial,sans-serif; font-size:22px; font-weight:bold; text-anchor:middle; }
.jar-sub  { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:10px; text-anchor:middle; fill:#6b7280; }
.tick-lbl { font-family: PoynterAgateOne-Condensed,'Poynter Agate One','Arial Narrow',Arial,sans-serif; font-size:8.5px; fill:#9ca3af; }
</style>
</defs>

<!-- Background -->
<rect width="480" height="480" fill="#ffffff"/>

<!-- Masthead -->
<rect class="mast-bg" width="480" height="29"/>
<text transform="translate(6 21) scale(1 1.11)" class="wm-wh">STA<tspan class="wm-dk">TOI</tspan>STICS</text>
<text transform="translate(128 22) scale(1 1.11)" class="tagline">A slice of life in numbers</text>

<!-- Border -->
<rect class="border" x="0.4" y="0.4" width="479.2" height="479.2"/>

<!-- Headline -->
<text x="240" y="67" text-anchor="middle" class="hl">Your insurance card won&#x2019;t save you</text>
<text x="240" y="96" text-anchor="middle" class="hl">at a private hospital.</text>

<!-- Deck -->
<text x="240" y="119" text-anchor="middle" class="deck">3 in 5 insured patients at a private hospital still face a bill that</text>
<text x="240" y="136" text-anchor="middle" class="deck">wipes out more than a month&#x2019;s household spending on food.</text>

<!-- Separator -->
<line class="sep" x1="30" y1="149" x2="450" y2="149"/>

<!-- === THREE JARS/TANKS showing months of food spent === -->
<!-- Jar 1: Govt Hospital (0.16 months) -->
<!-- Jar 2: Private Hospital INSURED (1.43 months) -->
<!-- Jar 3: Private Hospital UNINSURED (2.67 months) -->

<!-- Scale: max = 3 months = full jar height 200px at y=160 to y=360 -->
<!-- 1 month = 66.7px -->
<!-- jar width = 80px, jar positions: x=60, x=195, x=330 -->

<!-- JAR 1: Govt Hospital -->
<!-- Jar outline -->
<rect x="60" y="165" width="80" height="200" rx="4" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<!-- Fill: 0.16 months = 0.16 * 66.7 = 10.7px from bottom -->
<rect x="61" y="354" width="78" height="11" rx="2" fill="#1d3461"/>
<!-- Tick marks at 1 and 2 months -->
<line x1="138" y1="298" x2="143" y2="298" stroke="#d1d5db" stroke-width="0.8"/>
<text x="145" y="301" class="tick-lbl">1 month</text>
<line x1="138" y1="231" x2="143" y2="231" stroke="#d1d5db" stroke-width="0.8"/>
<text x="145" y="234" class="tick-lbl">2 months</text>
<line x1="138" y1="165" x2="143" y2="165" stroke="#d1d5db" stroke-width="0.8"/>
<text x="145" y="168" class="tick-lbl">3 months</text>
<!-- Value inside jar -->
<text x="100" y="350" class="jar-val" style="fill:#1d3461;">0.16</text>
<!-- Label below -->
<text x="100" y="378" class="jar-lbl" style="fill:#374151;">Govt</text>
<text x="100" y="391" class="jar-lbl" style="fill:#374151;">Hospital</text>
<text x="100" y="406" class="jar-sub">any insurance status</text>

<!-- JAR 2: Private Hospital INSURED -->
<rect x="195" y="165" width="80" height="200" rx="4" fill="none" stroke="#f97316" stroke-width="1.5"/>
<!-- Fill: 1.43 months = 1.43 * 66.7 = 95.4px -->
<rect x="196" y="270" width="78" height="95" rx="2" fill="#f97316" fill-opacity="0.75"/>
<!-- 1-month line inside -->
<line x1="195" y1="298" x2="275" y2="298" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,2"/>
<!-- Value -->
<text x="235" y="320" class="jar-val" style="fill:#ffffff;">1.43</text>
<text x="235" y="334" class="jar-sub" style="fill:#ffffff;">months of food</text>
<!-- Label below -->
<text x="235" y="378" class="jar-lbl" style="fill:#c2410c;">Private Hospital</text>
<text x="235" y="391" class="jar-lbl" style="fill:#c2410c;">WITH Insurance</text>
<text x="235" y="406" class="jar-sub">n = 579</text>

<!-- JAR 3: Private Hospital UNINSURED -->
<rect x="330" y="165" width="80" height="200" rx="4" fill="none" stroke="#c1121f" stroke-width="2"/>
<!-- Fill: 2.67 months = 2.67 * 66.7 = 178px -->
<rect x="331" y="187" width="78" height="178" rx="2" fill="#c1121f" fill-opacity="0.8"/>
<!-- 1 and 2 month lines inside -->
<line x1="330" y1="298" x2="410" y2="298" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="330" y1="231" x2="410" y2="231" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,2"/>
<!-- Value -->
<text x="370" y="260" class="jar-val" style="fill:#ffffff;">2.67</text>
<text x="370" y="274" class="jar-sub" style="fill:#ffffff;">months of food</text>
<!-- Label below -->
<text x="370" y="378" class="jar-lbl" style="fill:#c1121f;">Private Hospital</text>
<text x="370" y="391" class="jar-lbl" style="fill:#c1121f;">NO Insurance</text>
<text x="370" y="406" class="jar-sub">n = 1,265</text>

<!-- Big stat callout -->
<rect x="55" y="413" width="370" height="22" rx="3" fill="#fff0f0" stroke="#c1121f" stroke-width="0.8"/>
<text x="240" y="428" text-anchor="middle" style="font-family:PoynterAgateOne-BoldCondensed,'Arial Narrow',Arial,sans-serif;font-size:11px;font-weight:bold;fill:#c1121f;">59% of insured private-hospital patients face catastrophic spend</text>

<!-- Footer separator -->
<line class="sep" x1="30" y1="443" x2="450" y2="443"/>

<!-- Note -->
<text x="240" y="456" text-anchor="middle" class="note">Months of food = inpatient OOPE &#xF7; household monthly food spend. Catastrophic = &gt;1 month of food.</text>

<!-- Source -->
<text x="240" y="469" text-anchor="middle" class="source">Source: Citizen Survey 2022&#x2013;23 · Lancet Citizens&#x2019; Commission on Reimagining India&#x2019;s Health System</text>
</svg>
